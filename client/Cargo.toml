[package]
name = "wardrobe-client"
version = "0.26.724"
edition = "2024"
license = "MIT"
description = "Pure network client library crate for server-backed Wardrobe connections."
documentation = "https://docs.rs/wardrobe-client"
homepage = "https://github.com/totalknowledge/wardrobe"
repository = "https://github.com/totalknowledge/wardrobe"

[lib]
name = "wardrobe_client"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rcgen = { version = "0.14.8", features = ["x509-parser"] }
uuid = { version = "1.0", features = ["v4"] }
x509-parser = "0.18.1"
