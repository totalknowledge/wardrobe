name: Build Release Artifacts

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Wardrobe CLI & Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release -p wardrobe-cli -p wardrobe-server

      - name: Build Debian packages
        run: |
          bash ./utilities/scripts/build-debs.sh

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' cli/Cargo.toml | head -n 1)
          ARCH=$(dpkg --print-architecture)
          DIST_DIR="target/dist"

          mkdir -p "$DIST_DIR"

          CLI_STAGE=$(mktemp -d)
          cp target/release/wardrobe "$CLI_STAGE/"
          cp cli/README.md "$CLI_STAGE/" 2>/dev/null || true
          cp LICENSE "$CLI_STAGE/" 2>/dev/null || true

          tar -czf \
            "$DIST_DIR/wardrobe-cli_${VERSION}_${ARCH}.tar.gz" \
            -C "$CLI_STAGE" .

          SERVER_STAGE=$(mktemp -d)
          cp target/release/wardrobe-server "$SERVER_STAGE/"
          cp server/README.md "$SERVER_STAGE/" 2>/dev/null || true
          cp LICENSE "$SERVER_STAGE/" 2>/dev/null || true

          tar -czf \
            "$DIST_DIR/wardrobe-server_${VERSION}_${ARCH}.tar.gz" \
            -C "$SERVER_STAGE" .

          cp target/debian/*.deb "$DIST_DIR/"

          echo "Release files:"
          ls -lh "$DIST_DIR"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Wardrobe ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            target/dist/*.deb
            target/dist/*.tar.gz
