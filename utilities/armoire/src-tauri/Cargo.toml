[package]
name = "armoire"
version = "0.26.725"
description = "Wardrobe Database Administration Tool"
authors = ["Bryan Patrick Coleman"]
license-file = "../LICENSE"
repository = ""
edition = "2021"
rust-version = "1.96.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "armoire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "armoire"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
wardrobe-embedded = "0.26.725"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["custom-protocol"] }
tauri-plugin-log = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
