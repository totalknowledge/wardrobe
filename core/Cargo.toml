[package]
name = "wardrobe-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "wardrobe_core"
path = "src/lib.rs"

[[bin]]
name = "wardrobe"
path = "src/main.rs"

[dependencies]
rand = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
