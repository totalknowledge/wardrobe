<div class="flex flex-col h-screen overflow-hidden">

  <header class="menubar navbar bg-base-300 h-4 border-b px-2 shrink-0 text-sm">
    <div class="navbar-center flex-1 justify-start">
      <ul class="menu menu-horizontal menu-sm p-0">
        <li>
          <details #connectionMenu>
            <summary>Connection</summary>
            <ul class="absolute top-full -translate-y-10 mt-1 p-2 shadow-lg bg-base-200 z-[1] w-48">
              <li (click)="connectionMenu.removeAttribute('open')"><a>Add&nbsp;Server</a></li>
              <li><a>Add&nbsp;File</a></li>
            </ul>
          </details>
        </li>
        <li>
          <details>
            <summary class="rounded-sm">Database</summary>
            <ul class="p-2 shadow-lg bg-base-200 z-[1] w-48">
              <li><a>New&nbsp;Schema</a></li>
            </ul>
          </details>
        </li>
        <li>
          <details>
            <summary class="rounded-sm">Query</summary>
            <ul class="p-2 shadow-lg bg-base-200 z-[1] w-48">
              <li><a>SQL&nbsp;Editor</a></li>
            </ul>
          </details>
        </li>
        <li>
          <details #settingsMenu>
            <summary class="rounded-sm">Settings</summary>
            <ul class="p-2 shadow-lg bg-base-200 z-[1] w-48">
              <li><a>Preferences</a></li>
            </ul>
          </details>
        </li>
        <li>
          <details #helpMenu>
            <summary class="rounded-sm">Help</summary>
            <ul class="p-2 shadow-lg bg-base-200 z-[1] w-48">
              <li><a (click)="about()">About</a></li>
            </ul>
          </details>
        </li>
      </ul>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-4 bg-base-100">
    <router-outlet></router-outlet>
    <li (click)="testWardrobeDatabaseAccess()">
      <a href="#">Test Wardrobe Database</a>
    </li>
  </main>

  <footer
    class="infobar h-8 bg-base-300 border-t border-base-content/10 px-4 flex items-center justify-between text-xs shrink-0">
    <div class="flex">
      <div class="mr-4">Status: {{databaseService.testDatabaseAccessStatus()}} </div>
      <div>Engine: Wardrobe</div>
    </div>
    <span class="ml-auto">Armoire v0.0.1</span>
  </footer>
</div>
