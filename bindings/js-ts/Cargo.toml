[package]
name = "wardrobe-js-ts"
version = "0.26.723"
edition = "2024"
authors = ["Wardrobe Maintainers"]
description = "Native implementation and validation crate for Wardrobe JavaScript and TypeScript bindings."
repository = "https://github.com/totalknowledge/wardrobe"
readme = "README.md"
license = "MIT"
keywords = ["database", "bindings", "typescript", "javascript", "wardrobe"]
categories = ["api-bindings", "database-implementations"]
include = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "client/**/*",
    "embedded/**/*",
    "package.json",
    "src/**/*.rs",
]

[lib]
name = "wardrobe_js_ts"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4", "compat-mode"] }
napi-derive = "2.16"
wardrobe-core = { path = "../../core" }
serde_json = "1.0"
