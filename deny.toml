[graph]
targets = []
exclude = []

[licenses]
version = 2
confidence-threshold = 0.8

# Permissive & dataset licenses found in dependencies
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "ISC",
    "Zlib",
]

# Grant an exception for your own BSL/BUSL-1.1 server package in the workspace
[[licenses.exceptions]]
allow = ["BUSL-1.1"]
name = "wardrobe-server"

[[licenses.exceptions]]
allow = ["LicenseRef-ASEL"]
name = "armoire"

[[licenses.clarify]]
name = "armoire"
expression = "LicenseRef-ASEL"
license-files = [
    { path = "../LICENSE", hash = 0x26c9179a },
]
